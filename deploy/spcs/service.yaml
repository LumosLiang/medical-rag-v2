spec:
  containers:
    - name: backend
      mountSessionToken: true
      image: /medrag/ops/app_images/backend:20261013-citations
      env:
        SNOWFLAKE_DATABASE: MEDRAG
        SNOWFLAKE_SCHEMA: CORE
        SNOWFLAKE_WAREHOUSE: MEDICAL_RAG_INDEX_WH
        RAG_CONFIG_NAME: structured_markdown_8k_body_1024
        RAG_SEARCH_SERVICE: MEDICAL_CHUNKS_STRUCTURED_MARKDOWN_8K_BODY_1024
        RAG_MODEL: claude-opus-5
      readinessProbe:
        port: 8000
        path: /healthz
    - name: frontend
      image: /medrag/ops/app_images/frontend:20261013-citations
      mountSessionToken: false
      env:
        BACKEND_URL: http://localhost:8000
      readinessProbe:
        port: 8501
        path: /_stcore/health
  endpoints:
    - name: ui
      port: 8501
      public: true
serviceRoles:
  - name: ui_access
    endpoints:
      - ui
